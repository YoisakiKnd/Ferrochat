name: release
on:
  push:
    tags: ["v*"]
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
            docker: messense/rust-musl-cross:aarch64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (host musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Build (native)
        if: ${{ !matrix.docker }}
        run: cargo build --release --manifest-path backend/Cargo.toml --target ${{ matrix.target }} --bin ferrochat
      - name: Build (cross container)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD:/io" -w /io ${{ matrix.docker }} bash -lc '
            export CC_aarch64_unknown_linux_musl=$TARGET_CC \
                   CXX_aarch64_unknown_linux_musl=$TARGET_CXX \
                   AR_aarch64_unknown_linux_musl=$TARGET_AR
            cargo build --release --manifest-path backend/Cargo.toml --target aarch64-unknown-linux-musl --bin ferrochat
            # The container runs as root, so everything it creates is root-owned:
            # checksum here, on the host this directory is not writable.
            bin=backend/target/aarch64-unknown-linux-musl/release/ferrochat
            sha256sum "$bin" > "$bin.sha256"
            chmod a+r "$bin" "$bin.sha256"'
      - name: Package platform-specific binary and checksum
        shell: bash
        run: |
          bin=backend/target/${{ matrix.target }}/release/ferrochat${{ matrix.exe }}
          asset=ferrochat-${{ matrix.target }}${{ matrix.exe }}
          mkdir -p dist
          cp "$bin" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ferrochat-${{ matrix.target }}
          path: dist/*
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Prepare changelog release notes
        shell: bash
        run: |
          python3 - "$GITHUB_REF_NAME" > release-notes.md <<'PY'
          import pathlib, sys
          version = sys.argv[1].removeprefix("v")
          lines = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith(f"## {version} - "))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          print("\n".join(lines[start + 1:end]).strip())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # Re-pointing a release tag re-runs publish against the existing
          # release; without this, uploading the same asset names fails.
          overwrite_files: true
