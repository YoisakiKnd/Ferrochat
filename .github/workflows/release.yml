name: release
on:
  push:
    tags: ["v*"]
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
            docker: messense/rust-musl-cross:aarch64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (host musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Build (native)
        if: ${{ !matrix.docker }}
        run: cargo build --release --manifest-path backend/Cargo.toml --target ${{ matrix.target }} --bin ferrochat
      - name: Build (cross container)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD:/io" -w /io ${{ matrix.docker }} bash -lc '
            export CC_aarch64_unknown_linux_musl=$TARGET_CC \
                   CXX_aarch64_unknown_linux_musl=$TARGET_CXX \
                   AR_aarch64_unknown_linux_musl=$TARGET_AR
            cargo build --release --manifest-path backend/Cargo.toml --target aarch64-unknown-linux-musl --bin ferrochat'
      - name: checksum
        shell: bash
        run: |
          bin=backend/target/${{ matrix.target }}/release/ferrochat${{ matrix.exe }}
          if command -v sha256sum >/dev/null; then sha256sum "$bin" > "$bin.sha256"; else shasum -a 256 "$bin" > "$bin.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ferrochat-${{ matrix.target }}
          path: |
            backend/target/${{ matrix.target }}/release/ferrochat${{ matrix.exe }}
            backend/target/${{ matrix.target }}/release/ferrochat${{ matrix.exe }}.sha256
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
