name: release
on:
  push:
    tags: ["v*"]
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cargo build --release --manifest-path backend/Cargo.toml --target ${{ matrix.target }} --bin ferrochat
      - name: checksum
        shell: bash
        run: |
          bin=$(ls backend/target/${{ matrix.target }}/release/ferrochat* | head -1)
          sha256sum "$bin" > "$bin.sha256" || shasum -a 256 "$bin" > "$bin.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ferrochat-${{ matrix.target }}
          path: |
            backend/target/${{ matrix.target }}/release/ferrochat*
            backend/target/${{ matrix.target }}/release/*.sha256
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
