name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject leftover upstream branding
        run: |
          if grep -RInE --exclude-dir=reference --exclude-dir=node_modules --exclude-dir=target --exclude=LICENSE --exclude=NOTICE --exclude=README.md --exclude=ci.yml -e 'open.?webui' -e 'openwebui\.com' . \
            | grep -v "src/lib/components/chat/Settings/About.svelte"; then
            echo "unexpected upstream branding"
            exit 1
          fi
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --manifest-path backend/Cargo.toml --check
      - name: Stub frontend build for rust-embed
        run: mkdir -p frontend/build && printf '<!doctype html><title>Ferrochat</title>' > frontend/build/index.html
      - run: cargo test --manifest-path backend/Cargo.toml
      - name: Migrations are append-only
        run: |
          python3 - << 'PY'
          import hashlib, pathlib
          root = pathlib.Path("backend/crates/db/migrations")
          known = {
              "001_init.sql",
              "002_models_share.sql",
              "003_file_passages.sql",
              "004_memories.sql",
              "005_chat_search.sql",
          }
          found = {p.name for p in root.glob("*.sql")}
          if found != known:
              raise SystemExit(f"migration set changed: added={sorted(found - known)} removed={sorted(known - found)}")
          for digest_file in sorted(root.glob("*.sql.sha256")):
              name = digest_file.name[: -len(".sha256")]
              expected = digest_file.read_text().strip()
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if got != expected:
                  raise SystemExit(f"{name} changed ({got}); add a new migration instead")
          frozen = {p.name[: -len(".sha256")] for p in root.glob("*.sql.sha256")}
          print("migrations ok, digest still needed for:", sorted(found - frozen) or "none")
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Print artifact sizes
        run: sh scripts/measure.sh
      - name: Type errors must not exceed baseline
        working-directory: frontend
        run: |
          count=$(npx svelte-check --output machine | awk '/COMPLETED/ {print $5}')
          baseline=$(cat .svelte-check-baseline)
          echo "svelte-check errors: $count (baseline $baseline)"
          test "$count" -le "$baseline"
      - uses: dtolnay/rust-toolchain@stable
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --grep-invert "@chats"
        working-directory: frontend
      - name: Playwright chat suite (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npx playwright test --grep "@chats"
        working-directory: frontend
