[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/providers", "crates/mcp", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
eventsource-stream = "0.2"
ferrochat-core = { path = "crates/core" }
ferrochat-db = { path = "crates/db" }
ferrochat-mcp = { path = "crates/mcp" }
ferrochat-providers = { path = "crates/providers" }
futures = "0.3"
jsonwebtoken = "9"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = "=0.16.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
